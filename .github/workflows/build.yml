name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Pinocchio
        uses: actions/checkout@v4
        with:
          repository: stack-of-tasks/pinocchio
          ref: v3.0.0
          path: pinocchio

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Node Dependencies
        run: npm install

      - name: Setup Emscripten SDK
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.9
          actions-cache-folder: 'emsdk-cache'

      - name: Verify Emscripten
        run: emcc -v

      - name: Checkout emscripten llvm-project for OpenMP
        uses: actions/checkout@v7
        with:
          repository: emscripten-core/llvm-project
          ref: emscripten-libs-22
          path: llvm-project

      - name: Build OpenMP
        run: |
            mkdir -p build-openmp && cd build-openmp
            # CMake options from https://github.com/emscripten-core/emscripten/blob/6.0.9/system/lib/update_openmp.py#L64
            emcmake cmake \
              ../llvm-project/runtimes \
              -DLLVM_ENABLE_RUNTIMES=openmp \
              -DLLVM_DEFAULT_TARGET_TRIPLE=wasm32-unknown-emscripten \
              -DOPENMP_ENABLE_LIBOMPTARGET=OFF \
              -DLIBOMP_HAVE_OMPT_SUPPORT=OFF \
              -DLIBOMP_OMPT_SUPPORT=OFF \
              -DLIBOMP_OMPD_SUPPORT=OFF \
              -DLIBOMP_USE_DEBUGGER=OFF \
              -DLIBOMP_FORTRAN_MODULES=OFF \
              -DLIBOMP_ENABLE_SHARED=OFF \
              -DLIBOMP_ARCH=wasm32 \
              -DOPENMP_ENABLE_LIBOMPTARGET_PROFILING=OFF
            emmake make openmp -j$(nproc)
            ls -lh openmp/runtime/src/libomp.a

      - name: Build WASM
        run: |
          mkdir -p build && cd build
          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DPINOCCHIO_SOURCE_DIR=$(pwd)/../pinocchio
          emmake make -j$(nproc)

      - name: Run Tests
        run: npm test

      - name: Run TypeScript Type Check
        run: npm run test:types

      - name: Run Smoke Test
        run: npm run test:smoke

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pinocchio-wasm-build
          path: |
            build/pinocchio.js
            build/pinocchio.wasm
            src/pinocchio.d.ts
            src/urdf-parser.d.ts
            src/collision-checker.d.ts
          retention-days: 7
